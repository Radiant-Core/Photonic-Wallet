# Cache policy (white-screen fix):
#   - Hashed /assets/* are content-addressed -> cache forever.
#   - EVERYTHING else (index.html, sw.js, boot-recovery.js, manifest) must
#     revalidate on every load, or a stale shell can reference hashed assets a
#     deploy has deleted -> blank page.
# Implemented as a map + ONE server-level add_header, because nginx add_header
# does NOT merge across levels: a single add_header inside a location silently
# discards ALL server-level headers (the old per-location Cache-Control blocks
# were stripping the security headers off /assets and /sw.js responses).
map $uri $cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss: ws: https:; worker-src 'self' blob:; font-src 'self' data:;" always;
    add_header Cache-Control $cache_control always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Hashed static assets (Cache-Control comes from the map above;
    # no add_header here or the security headers vanish).
    location /assets/ {
        try_files $uri =404;
    }

    # Service worker — must 404 rather than fall back to index.html
    location = /sw.js {
        try_files $uri =404;
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (plain response; its add_header intentionally
    # replaces the inherited set — nothing sensitive is served here).
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
